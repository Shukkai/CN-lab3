apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
      - name: mongo
        image: mongo:6.0
        ports:
          - containerPort: 27017
        volumeMounts:
          - name: data
            mountPath: /data/db
        livenessProbe:
          exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"] }
          initialDelaySeconds: 20
          periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
      - name: backend
        image: ghcr.io/shukkai/backend:latest
        env:
          - { name: PORT,  value: "8888" }
          - { name: HOST,  value: "0.0.0.0" }
          - { name: MONGO_CONNECTION_STRING, value: "mongodb://mongo:27017/myMernApp" }
        ports:
          - containerPort: 8888
        livenessProbe:
          httpGet: { path: /ping, port: 8888 }
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet: { path: /ping, port: 8888 }
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      imagePullSecrets:
      - name: ghcr-creds
      containers:
      - name: frontend
        image: ghcr.io/shukkai/frontend:latest
        ports:
          - containerPort: 80
        livenessProbe:
          httpGet: { path: /, port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet: { path: /, port: 80 }
          initialDelaySeconds: 5
          periodSeconds: 10
