name: CD - Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker image
      run: |
        IMAGE=ghcr.io/${{ github.repository_owner }}/cn-lab3:latest
        docker build -t $IMAGE .
        docker push $IMAGE
    
    - name: Push Docker image
      run: |
        IMAGE=ghcr.io/${{ github.repository_owner }}/cn-lab3:latest
        docker push $IMAGE

    - name: Smoke Test: Run Container and Check /health
      run: |
        IMAGE=ghcr.io/${{ github.repository_owner }}/cn-lab3:latest
        docker run -d -p 8080:3000 --name cn-lab3-smoke $IMAGE
        echo "Waiting 5 seconds for server to start..."
        sleep 5
        echo "Testing /health endpoint..."
        curl --retry 3 --retry-connrefused --fail http://localhost:8080/health