name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: 20
  COVERAGE_DIR: coverage
  FORMAT_COMMIT_MSG: 'style: auto-format code [skip ci]'

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        run: npx vitest --coverage.enabled true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.COVERAGE_DIR }}/

      - name: Download previous coverage
        id: oldcov
        uses: dawidd6/action-download-artifact@v3
        with:
          name: coverage-report
          path: old-coverage
          if_no_artifact_found: warn
          github_token: ${{ secrets.GHCR_TOKEN }} # 重要：用 PAT 取代預設 Token

      - name: Compare coverage
        run: |
          if [ -f old-coverage/coverage-final.json ]; then
            NEW=$(jq '.total.lines.pct' $COVERAGE_DIR/coverage-final.json)
            OLD=$(jq '.total.lines.pct' old-coverage/coverage-final.json)
            echo "Previous: $OLD%   Current: $NEW%"
            if (( $(echo "$NEW < $OLD" | bc -l) )); then
              echo "Coverage dropped"
              exit 1
            fi
          else
            echo "No previous coverage found; skipping comparison."
          fi

  auto-format:
    needs: test-and-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prettier check
        run: npx prettier --check . --ignore-unknown
        continue-on-error: true
