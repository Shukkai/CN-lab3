name: CI - Test, Coverage, Format

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-format:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage (Vitest)
      run: npm test

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

    - name: Download previous coverage report
      id: prev
      continue-on-error: true
      uses: dawidd6/action-download-artifact@v3
      with:
        name: coverage-report
        workflow: ci.yaml
        path: old-coverage

    - name: Compare coverage
      run: |
        if [ -f old-coverage/coverage-final.json ]; then
          NEW=$(jq '.total.lines.pct' coverage/coverage-final.json)
          OLD=$(jq '.total.lines.pct' old-coverage/coverage-final.json)
          echo "Previous: $OLD%, Current: $NEW%"
          awk -v new=$NEW -v old=$OLD 'BEGIN { exit (new < old ? 1 : 0) }'
        else
          echo "No previous coverage – skipping comparison."
        }

    - name: Check & Format Changed Files
      run: |
        CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- '*.ts' '*.js')
        if [ -z "$CHANGED" ]; then
          echo "No relevant files changed."
          exit 0
        fi

        npx prettier --check $CHANGED || {
          echo "Formatting needed – applying Prettier"
          npx prettier --write $CHANGED
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git commit -am "chore: auto format by Prettier"
          git push
        }