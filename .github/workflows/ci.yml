name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: 20
  COVERAGE_DIR: coverage
  FORMAT_COMMIT_MSG: 'style: auto-format code [skip ci]'

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        run: npx vitest --coverage.enabled true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./backend/${{ env.COVERAGE_DIR }}/
      - name: Debug artifact contents
        run: |
          echo "Old coverage dir:"
          find ./old-coverage
      - name: Download previous coverage
        id: oldcov
        uses: dawidd6/action-download-artifact@v3
        with:
          name: coverage-report
          path: old-coverage
          if_no_artifact_found: warn
          github_token: ${{ secrets.GHCR_TOKEN }}

      - name: Compare coverage
        run: |
          echo "Checking old and new coverage..."
          echo "Current run: ./backend/coverage/coverage-final.json"
          echo "Previous run: ./old-coverage/coverage/coverage-final.json"

          if [ -f ./old-coverage/coverage/coverage-final.json ] && [ -f ./backend/coverage/coverage-final.json ]; then
            NEW=$(jq '.total.lines.pct' ./backend/coverage/coverage-final.json)
            OLD=$(jq '.total.lines.pct' ./old-coverage/coverage/coverage-final.json)
            echo "📊 Previous coverage: $OLD%"
            echo "📈 Current coverage:  $NEW%"
            if (( $(echo "$NEW < $OLD" | bc -l) )); then
              echo "❌ Coverage dropped: $NEW% < $OLD%"
              exit 1
            else
              echo "✅ Coverage OK: $NEW% >= $OLD%"
            fi
          else
            echo "⚠️ Coverage files not found; skipping comparison."
          fi

  auto-format:
    needs: test-and-coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prettier check + write (no commit)
        run: npx prettier --check . --ignore-unknown || npx prettier --write . --ignore-unknown