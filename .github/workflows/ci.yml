name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm ci --ignore-scripts

      - name: Check formatting
        id: prettier
        run: npx prettier --check .

      # ⬇ 只有 main 分支 push 且格式錯誤才自動修正並 commit
      - name: Auto-format & commit
        if: failure() && github.ref == 'refs/heads/main' && github.repository == github.event.repository.full_name
        run: npx prettier --write .

      - name: Push formatted code
        if: steps.prettier.outcome == 'failure' && github.ref == 'refs/heads/main' && github.repository == github.event.repository.full_name
        uses: stefanzweifel/git-auto-commit-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}   # PAT (repo scope)
        with:
          commit_message: "style: auto-format code [skip ci]"
          push_options: --no-verify

  backend-test:
    runs-on: ubuntu-latest
    needs: lint-format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Vitest (with coverage)
        working-directory: backend
        run: npx vitest --coverage.enabled true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Summary badge (optional)
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: backend
          github-token: ${{ secrets.GITHUB_TOKEN }}

  frontend-test:
    runs-on: ubuntu-latest
    needs: lint-format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # 若有前端單測，可放 Vitest/Jest；以下示範 e2e
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          build: npm run build
          start: npm run preview -- --port 5173
          wait-on: "http://localhost:5173"