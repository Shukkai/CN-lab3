name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: 20
  COVERAGE_DIR: coverage
  FORMAT_COMMIT_MSG: 'style: auto-format code [skip ci]'

permissions:
  contents: write
  actions: write

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install backend dependencies
        run: npm ci --ignore-scripts
        working-directory: ./backend

      - name: Run unit tests with coverage
        run: npm run test -- --coverage.enabled true
        working-directory: ./backend

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/

      - name: Download previous coverage
        id: oldcov
        uses: dawidd6/action-download-artifact@v4
        with:
          name: coverage-report 
          path: old-coverage
          if_no_artifact_found: warn
          github_token: ${{ secrets.GHCR_TOKEN }}
        continue-on-error: true

      - name: Compare coverage
        run: |
          echo "Checking old and new coverage..."

          CURRENT_COV_FILE="backend/coverage/coverage-final.json"
          OLD_COV_FILE="old-coverage/coverage-final.json"
          echo "Checking coverage files..."
          echo "Current:  $CURRENT_COV_FILE"
          echo "Previous: $OLD_COV_FILE"

          if [ -f "$CURRENT_COV_FILE" ] && [ -f "$OLD_COV_FILE" ]; then
            NEW=$(jq '
              to_entries
              | map(.value.s | to_entries | map(.value))
              | map({covered: map(select(. > 0)) | length, total: length})
              | reduce .[] as $f ({covered: 0, total: 0}; .covered += $f.covered | .total += $f.total)
              | if .total > 0 then (.covered / .total * 100) else 0 end
            ' "$CURRENT_COV_FILE")

            OLD=$(jq '
              to_entries
              | map(.value.s | to_entries | map(.value))
              | map({covered: map(select(. > 0)) | length, total: length})
              | reduce .[] as $f ({covered: 0, total: 0}; .covered += $f.covered | .total += $f.total)
              | if .total > 0 then (.covered / .total * 100) else 0 end
            ' "$OLD_COV_FILE")

            echo "Previous coverage: $OLD%"
            echo "Current coverage:  $NEW%"

            if (( $(echo "$NEW < $OLD" | bc -l) )); then
              echo "Coverage dropped: $NEW% < $OLD%"
              exit 1
            else
              echo "Coverage OK: $NEW% >= $OLD%"
            fi
          else
            echo "Missing coverage-final.json files; skipping comparison."
          fi
  auto-format:
    needs: test-and-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies for frontend
        run: npm ci --ignore-scripts
        working-directory: ./frontend

      - name: Install dependencies for backend
        run: npm ci --ignore-scripts
        working-directory: ./backend

      - name: Prettier - Frontend all
        run: npx prettier --check . || npx prettier --write .
        working-directory: ./frontend

      - name: Prettier - Backend src/
        run: npx prettier --check 'src/**/*.{js,ts,tsx,json,cjs,mjs}' || npx prettier --write 'src/**/*.{js,ts,tsx,json,cjs,mjs}'
        working-directory: ./backend

      - name: Prettier - Backend test/
        run: npx prettier --check 'test/**/*.{js,ts,tsx,json,cjs,mjs}' || npx prettier --write 'test/**/*.{js,ts,tsx,json,cjs,mjs}'
        working-directory: ./backend