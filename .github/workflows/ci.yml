name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: 20
  COVERAGE_DIR: coverage
  FORMAT_COMMIT_MSG: 'style: auto-format code [skip ci]'

permissions:
  contents: write
  actions: write

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        run: npm run test -- --coverage.enabled true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/coverage-final.json

      - name: Download previous coverage
        id: oldcov
        uses: dawidd6/action-download-artifact@v3
        with:
          name: coverage-report
          path: old-coverage
          if_no_artifact_found: warn
          github_token: ${{ secrets.GHCR_TOKEN }}
        continue-on-error: true

      - name: Compare coverage
        run: |
          echo "Checking old and new coverage..."
          echo "Current:  ./backend/coverage/coverage-final.json"
          echo "Previous: ./old-coverage/coverage-final.json"

          if [ -f ./old-coverage/coverage-final.json ] && [ -f ./backend/coverage/coverage-final.json ]; then
            NEW=$(jq '.total.lines.pct' ./backend/coverage/coverage-final.json)
            OLD=$(jq '.total.lines.pct' ./old-coverage/coverage-final.json)
            echo "Previous: $OLD%"
            echo "Current:  $NEW%"
            if (( $(echo "$NEW < $OLD" | bc -l) )); then
              echo "Coverage dropped"
              exit 1
            else
              echo "Coverage improved or same"
            fi
          else
            echo "Coverage files not found; skipping comparison."
          fi
  auto-format:
    needs: test-and-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies for frontend
        run: npm ci --ignore-scripts
        working-directory: ./frontend

      - name: Install dependencies for backend
        run: npm ci --ignore-scripts
        working-directory: ./backend

      - name: Prettier - Frontend all
        run: npx prettier --check . || npx prettier --write .
        working-directory: ./frontend

      - name: Prettier - Backend src/
        run: npx prettier --check 'src/**/*.{js,ts,tsx,json,cjs,mjs}' || npx prettier --write 'src/**/*.{js,ts,tsx,json,cjs,mjs}'
        working-directory: ./backend

      - name: Prettier - Backend test/
        run: npx prettier --check 'test/**/*.{js,ts,tsx,json,cjs,mjs}' || npx prettier --write 'test/**/*.{js,ts,tsx,json,cjs,mjs}'
        working-directory: ./backend