name: CI - Test, Coverage, Format

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-format:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage (Vitest)
      run: npm test

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

    - name: Download previous coverage report
      uses: dawidd6/action-download-artifact@v3
      with:
        name: coverage-report
        path: old-coverage
        if_no_artifact_found: warn       

    - name: Compare coverage
      run: |
        if [ -f old-coverage/coverage-final.json ]; then
          NEW=$(jq '.total.lines.pct' coverage/coverage-final.json)
          OLD=$(jq '.total.lines.pct' old-coverage/coverage-final.json)
          echo "Previous coverage: $OLD%"
          echo "Current coverage:  $NEW%"
          awk -v new=$NEW -v old=$OLD 'BEGIN { exit (new < old ? 1 : 0) }'
        else
          echo "No previous coverage found. Skipping comparison."
        fi

    - name: Checkout full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 