name: CI – Test, Coverage, Format

on:
  push:
    branches: [main]
  pull_request:

jobs:
  auto-format:
    runs-on: ubuntu-latest
    # 只對非 Fork 的 push 分支執行自動 commit（PR 仍會跑但不 push）
    if: github.event_name == 'push' && github.repository == github.event.repository.full_name

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # 取完整歷史，才能安全地 commit & push
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install deps (formatter only)
      run: npm ci --ignore-scripts

    # 你可以代換成 eslint --fix 或其他工具
    - name: Run Prettier
      run: npx prettier --write .

    # 只有當檔案真的被改動時才 commit
    - name: Auto-commit changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "style: auto-format code"
        commit_user_name: github-actions[bot]
        commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
        # 避免無限遞迴，例如 commit message 包含 [skip ci]
        push_options: '--follow-tags --no-verify'

  test-format:
    needs: auto-format          # 格式化完再跑測試
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0           # 取完整歷史以比較覆蓋率

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage (Vitest)
      run: npm test

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/

    - name: Download previous coverage report
      uses: dawidd6/action-download-artifact@v3
      with:
        name: coverage-report
        path: old-coverage
        if_no_artifact_found: warn       

    - name: Compare coverage
      run: |
        if [ -f old-coverage/coverage-final.json ]; then
          NEW=$(jq '.total.lines.pct' coverage/coverage-final.json)
          OLD=$(jq '.total.lines.pct' old-coverage/coverage-final.json)
          echo "Previous coverage: $OLD%"
          echo "Current coverage:  $NEW%"
          awk -v new=$NEW -v old=$OLD 'BEGIN { exit (new < old ? 1 : 0) }'
        else
          echo "No previous coverage found. Skipping comparison."
        fi