name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: 20
  COVERAGE_DIR: coverage
  FORMAT_COMMIT_MSG: 'style: auto-format code [skip ci]'

permissions:
  contents: write
  actions: write

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        run: npm run test -- --coverage.enabled true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/coverage-final.json

      - name: Download previous coverage
        id: oldcov
        uses: dawidd6/action-download-artifact@v3
        with:
          name: coverage-report
          path: old-coverage
          if_no_artifact_found: warn
          github_token: ${{ secrets.GHCR_TOKEN }}
        continue-on-error: true

      - name: Compare coverage
        run: |
          echo "Checking old and new coverage..."

          echo "Listing backend coverage directory:"
          ls -R ./backend/coverage || echo "Backend coverage dir missing"

          echo "Listing downloaded old coverage directory:"
          ls -R ./old-coverage || echo "Old coverage dir missing"

          CURRENT_COV="./backend/coverage/coverage-final.json"
          OLD_COV="./old-coverage/coverage-report/coverage-final.json"

          echo "Current coverage path:  $CURRENT_COV"
          echo "Previous coverage path: $OLD_COV"

          if [ -f "$CURRENT_COV" ]; then
            echo "Found new coverage-final.json"
          else
            echo "New coverage-final.json missing"
          fi

          if [ -f "$OLD_COV" ]; then
            echo "Found old coverage-final.json"
          else
            echo "Old coverage-final.json missing"
          fi

          if [ -f "$CURRENT_COV" ] && [ -f "$OLD_COV" ]; then
            NEW=$(jq '.total.lines.pct' "$CURRENT_COV")
            OLD=$(jq '.total.lines.pct' "$OLD_COV")
            echo "Previous coverage: $OLD%"
            echo "Current coverage:  $NEW%"
            if (( $(echo "$NEW < $OLD" | bc -l) )); then
              echo "Coverage dropped: $NEW% < $OLD%"
              exit 1
            else
              echo "Coverage OK: $NEW% >= $OLD%"
            fi
          else
            echo "Coverage files not found; skipping comparison."
          fi
  auto-format:
    needs: test-and-coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies for frontend
        run: npm ci --ignore-scripts
        working-directory: ./frontend

      - name: Install dependencies for backend
        run: npm ci --ignore-scripts
        working-directory: ./backend

      - name: Prettier - Frontend all
        run: npx prettier --check . || npx prettier --write .
        working-directory: ./frontend

      - name: Prettier - Backend src/
        run: npx prettier --check 'src/**/*.{js,ts,tsx,json,cjs,mjs}' || npx prettier --write 'src/**/*.{js,ts,tsx,json,cjs,mjs}'
        working-directory: ./backend

      - name: Prettier - Backend test/
        run: npx prettier --check 'test/**/*.{js,ts,tsx,json,cjs,mjs}' || npx prettier --write 'test/**/*.{js,ts,tsx,json,cjs,mjs}'
        working-directory: ./backend